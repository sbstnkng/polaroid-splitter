[project]
name = "polaroid-split"
version = "0.1.0"
description = "Split standardized Polaroid adapter scans into full-print PNGs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=11", "numpy>=2", "opencv-python-headless>=4.10"]

[project.urls]
Repository = "https://github.com/sbstnkng/polaroid-splitter"
Issues = "https://github.com/sbstnkng/polaroid-splitter/issues"

[project.scripts]
polaroid-split = "polaroid_split.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
